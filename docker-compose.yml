services:
  gebeya_db:
    image: postgres:16
    environment:
      POSTGRES_USER: gebeya
      POSTGRES_PASSWORD: gebeya123
      POSTGRES_DB: gebeya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gebeya"]
      interval: 5s
      timeout: 5s
      retries: 5
  gebeya_redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  gebeya_api:
    build:
      context: .
    container_name: gebeya-api
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - gebeya_db
      - gebeya_redis
    environment:
      DB_NAME: gebeya
      DB_USER: gebeya
      DB_PASSWORD: gebeya123
      DB_HOST: gebeya_db
      DB_PORT: 5432

volumes:
  postgres_data:

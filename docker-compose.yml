services:
  web:
    build:
      context: .
      dockerfile: apps/Dockerfile
    container_name: gebeya-api
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
    depends_on: []
